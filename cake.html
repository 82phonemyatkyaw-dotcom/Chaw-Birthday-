<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Cake ❤️</title>
    <link rel="stylesheet" href="cake.css">
</head>
<body>

<div class="container">

    <h1>🎉 Happy Birthday ❤️</h1>

    <p class="wish">
        ✨ Make a wish... then tap the candles ✨
    </p>

    <div class="cake">

        <div class="candles">
            <div class="candle" onclick="blowOut(this)">
                <div class="flame"></div>
                <div class="body"></div>
            </div>

            <div class="candle" onclick="blowOut(this)">
                <div class="flame"></div>
                <div class="body"></div>
            </div>

            <div class="candle" onclick="blowOut(this)">
                <div class="flame"></div>
                <div class="body"></div>
            </div>
        </div>

        <div class="cake-base"></div>

    </div> <h2 id="message"></h2>

</div>

<script src="cake.js"></script>
</body>
</html>
